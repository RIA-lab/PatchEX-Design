[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PED-Eval"
version = "0.1.0"
description = "Evaluate designed enzyme sequences for opt/ph tasks"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy>=1.22.4",
  "pandas>=1.5",
  "biopython>=1.81"
]

[project.optional-dependencies]
predictors = [
  "torch>=2.0,<2.5; python_version < '3.9'",
  "torch>=2.0; python_version >= '3.9'",
  "fair-esm>=2.0.0",
  "scikit-learn>=1.2,<1.4; python_version < '3.9'",
  "scikit-learn>=1.2; python_version >= '3.9'",
  "joblib>=1.2",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "transformers>=4.35,<4.47; python_version < '3.9'",
  "transformers>=4.35; python_version >= '3.9'"
]
structure = [
  "torch>=2.0,<2.5; python_version < '3.9'",
  "torch>=2.0; python_version >= '3.9'",
  "transformers>=4.35,<4.47; python_version < '3.9'",
  "transformers>=4.35; python_version >= '3.9'"
]

[project.scripts]
ped-eval = "ped_eval.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ped_eval*"]

